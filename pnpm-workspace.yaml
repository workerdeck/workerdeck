# workerdeck pnpm workspace. packages/ + apps/, all inter-package deps SYMLINKED
# (linkWorkspacePackages below), and each publishable package exposes a `@workerdeck/source`
# export condition so apps resolve straight to TS source (packages/*/src) in dev with no build
# step. Packages build to build/ via tsdown only on prepack/CI (never in dev). Turbo orchestrates.
#
# Every inter-package dep is `workspace:*`, which `pnpm publish` rewrites to the concrete
# version as it packs. `npm publish` does NOT — npm can't resolve the protocol here, since
# this workspace is declared to pnpm only (no `workspaces` field in the root package.json),
# so it would ship `workspace:*` verbatim and break every consumer. Releases therefore go
# through pnpm, always: `.github/workflows/publish.yml` on a tag, `pnpm publish:all` locally.
packages:
  - packages/*
  - apps/*
linkWorkspacePackages: true

# Transitive advisories our direct deps pin below their fixed versions. Each of
# these ships to a browser and renders **agent-authored** content, which is why
# they are overridden rather than waited out: `streamdown` (the transcript's
# markdown) pulls mermaid + dompurify, and `monaco-editor` pulls dompurify
# again. `brace-expansion` is dev-only (rimraf's clean scripts) and pinned for
# tidiness, not exposure.
#
# NOTE: overrides live HERE, not under a `pnpm` key in package.json — pnpm 11
# ignores that key and only WARNS, so an override written there silently fixes
# nothing while reading as though it did.
overrides:
  dompurify: ^3.4.14
  mermaid: ^11.17.0
  brace-expansion: ^5.0.9
  # Build/dev only — astro's image + frontmatter chain and vitest's vite. Pinned
  # to the patched range rather than the latest major, which is why these read
  # `^0.35.0`/`^4.3.1`/`^3.3.18` and not the newest versions on npm: the point is
  # to clear the advisory inside the range the parent already expects, not to
  # force a major through a dependency that did not ask for one.
  sharp: ^0.35.0
  js-yaml: ^4.3.1
  nanoid: ^3.3.18

allowBuilds:
  esbuild: true
  '@swc/core': true
  # sharp: Astro's default image service (apps/docs). Prebuilt binaries fetched on install.
  sharp: true
  # vsce internals (apps/vscode packaging). Neither build script is needed for
  # `vsce package`: vsce-sign only verifies downloads, keytar only backs
  # `vsce publish` credential storage — and we side-load the .vsix.
  '@vscode/vsce-sign': false
  keytar: false

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.217'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.217'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.217'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.217'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.217'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.217'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.217'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.217'
  - '@anthropic-ai/claude-agent-sdk@0.3.217'
  - '@silkweave/auth@5.1.0'
  - '@silkweave/core@5.1.0'
  - '@silkweave/trpc@5.1.0'
  - '@silkweave/mcp@5.1.0'
  - '@mermaid-js/parser@1.2.1'
  - dompurify@3.4.14
  - mermaid@11.17.0
  - '@astrojs/internal-helpers@0.10.4'
  - '@astrojs/markdown-satteri@0.3.7'
  - '@bruits/satteri-darwin-arm64@0.10.3'
  - '@bruits/satteri-darwin-x64@0.10.3'
  - '@bruits/satteri-linux-arm64-gnu@0.10.3'
  - '@bruits/satteri-linux-arm64-musl@0.10.3'
  - '@bruits/satteri-linux-x64-gnu@0.10.3'
  - '@bruits/satteri-linux-x64-musl@0.10.3'
  - '@bruits/satteri-wasm32-wasi@0.10.3'
  - '@bruits/satteri-win32-arm64-msvc@0.10.3'
  - '@bruits/satteri-win32-x64-msvc@0.10.3'
  - astro@7.2.4
  - satteri@0.10.3
