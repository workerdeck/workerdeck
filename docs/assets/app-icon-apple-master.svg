<!--
  Apple square 1024 master: the SAME tile as app-icon-apple-dark.svg with the
  ~22.4% corner radius (and the hairline that traced it) removed. iOS masks the
  icon itself, so shipping the pre-rounded preview would get double-masked.
  This is the file that feeds apps/ios AppIcon "Any Appearance".
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18181b" />
      <stop offset="1" stop-color="#09090b" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)" />
  <g transform="translate(512 512) scale(32) translate(-12 -12)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 20.5 7.75 12 12.5 3.5 7.75Z" stroke="#e8e8e8" />
    <path d="M3.5 12.25 12 17l8.5-4.75" stroke="#7c7c82" />
    <path d="M3.5 16.5 12 21.25l8.5-4.75" stroke="#7c7c82" />
    <path d="M12 4.71 17.42 7.75 12 10.79 6.58 7.75Z" fill="#2fbf71" opacity="0.18" stroke="none" />
    <path d="M12 6.15 14.85 7.75 12 9.35 9.15 7.75Z" fill="#2fbf71" stroke="none" />
  </g>
</svg>
