<!doctype html>
<!--
  Source for card-vscode.png (README showcase table). Render at 800x500 with 2x scaling:
  see "Regenerating the README showcase cards" in BRAND.md.
  One idea: the editor shape with the session in the BOTTOM PANEL (the extension's
  whole point) — activity bar with the WorkerDeck mark (monochrome, as VS Code itself
  masks it), sessions in the sidebar, `lines`-variant transcript rows in the panel,
  live dot in the window status bar.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 800px; height: 500px; overflow: hidden; }
  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #000;
    position: relative;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 520px 300px at 30% 25%, rgba(237,237,237,0.07), transparent 60%),
      radial-gradient(ellipse 420px 260px at 85% 85%, rgba(237,237,237,0.05), transparent 60%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 640px 400px at 50% 50%, black 30%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse 640px 400px at 50% 50%, black 30%, transparent 78%);
  }
  .window {
    position: absolute; left: 46px; top: 44px; width: 708px; height: 412px;
    background: #0b0b0b; border: 1px solid #2e2e2e; border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.02) inset;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .titlebar {
    flex: none; height: 30px; display: flex; align-items: center; gap: 8px;
    padding: 0 14px; border-bottom: 1px solid #1f1f1f;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #262626; }
  .titlebar .name { margin: 0 auto; height: 9px; width: 120px; border-radius: 5px; background: #202020; }
  .middle { flex: 1; display: flex; min-height: 0; }

  /* activity bar */
  .activity {
    flex: none; width: 44px; border-right: 1px solid #1f1f1f;
    display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 16px;
  }
  .aicon { width: 15px; height: 15px; border-radius: 4px; background: #2c2c2c; }
  .aicon.round { border-radius: 50%; }
  .amark { position: relative; width: 44px; display: flex; justify-content: center; }
  .amark::before {
    content: ''; position: absolute; left: 0; top: -2px; bottom: -2px; width: 2px; background: #d4d4d4;
  }

  /* sidebar: sessions */
  .sidebar {
    flex: none; width: 152px; border-right: 1px solid #1f1f1f;
    padding: 12px 10px; display: flex; flex-direction: column; gap: 8px;
  }
  .sb-head { height: 9px; width: 72px; border-radius: 5px; background: #242424; margin: 2px 2px 6px; }
  .scard { border-radius: 8px; padding: 8px 9px; display: flex; flex-direction: column; gap: 6px; }
  .scard.active { background: #1a1a1a; }
  .scard .r1 { display: flex; align-items: center; gap: 7px; }
  .scard .title { height: 10px; border-radius: 5px; background: #383838; }
  .scard .state { margin-left: auto; flex: none; width: 8px; height: 8px; border-radius: 50%; background: #3a3a3a; }
  .scard .r2 { display: flex; gap: 5px; }
  .scard .sub { height: 7px; border-radius: 4px; background: #242424; }

  /* editor + panel column */
  .col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .tabs { flex: none; height: 28px; display: flex; align-items: flex-end; border-bottom: 1px solid #1f1f1f; }
  .tab { width: 96px; height: 27px; display: flex; align-items: center; gap: 7px; padding: 0 12px; }
  .tab .tb { height: 8px; width: 56px; border-radius: 4px; background: #242424; }
  .tab.active { background: #111; border-right: 1px solid #1f1f1f; }
  .tab.active .tb { background: #3f3f3f; }
  .editor { flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 9px; background: #0d0d0d; min-height: 0; }
  .cl { height: 9px; border-radius: 4px; background: #262626; }
  .cl.dim { background: #1c1c1c; }

  /* bottom panel: the session */
  .panel { flex: none; height: 158px; border-top: 1px solid #2a2a2a; background: #0a0a0a; display: flex; flex-direction: column; }
  .ptabs {
    flex: none; height: 30px; display: flex; align-items: center; gap: 18px; padding: 0 16px;
    font-size: 11px; letter-spacing: 0.08em; color: #565656;
  }
  .ptab.agent { color: #f5f5f5; position: relative; font-weight: 600; }
  .ptab.agent::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -7px; height: 2px; background: #d4d4d4;
  }
  .prow {
    display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 24px;
    font-size: 14px; color: #8f8f8f;
  }
  .prow .g { flex: none; width: 16px; text-align: center; }
  .prow .g.caret { color: #d4d4d4; }
  .prow .elbow {
    flex: none; width: 16px; height: 14px; position: relative;
  }
  .prow .elbow::before {
    content: ''; position: absolute; left: 6px; top: 0; bottom: 3px; width: 2px; background: #444;
  }
  .prow .elbow::after {
    content: ''; position: absolute; left: 6px; bottom: 3px; width: 8px; height: 2px; background: #444;
  }
  .prow .b { height: 10px; border-radius: 5px; background: #2c2c2c; }
  .prow .b.dim { background: #202020; }

  /* status bar */
  .status {
    flex: none; height: 24px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; background: #141414; border-top: 1px solid #1f1f1f;
  }
  .live {
    width: 9px; height: 9px; border-radius: 50%; background: #2fbf71;
    box-shadow: 0 0 12px rgba(47,191,113,0.55);
  }
  .st { height: 8px; border-radius: 4px; background: #2b2b2b; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="window">
    <div class="titlebar">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="name"></div>
    </div>
    <div class="middle">
      <div class="activity">
        <div class="aicon"></div>
        <div class="aicon round"></div>
        <div class="amark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <g transform="translate(0 1.75)">
              <path d="M12 3 20.5 7.75 12 12.5 3.5 7.75Z" />
              <path d="M3.5 12.25 12 17l8.5-4.75" />
              <path d="M3.5 16.5 12 21.25l8.5-4.75" />
              <path d="M12 6.15 14.85 7.75 12 9.35 9.15 7.75Z" fill="#d4d4d4" stroke="none" />
            </g>
          </svg>
        </div>
        <div class="aicon"></div>
      </div>
      <div class="sidebar">
        <div class="sb-head"></div>
        <div class="scard active">
          <div class="r1"><div class="title" style="width: 76px"></div><div class="state" style="background:#2fbf71; box-shadow:0 0 10px rgba(47,191,113,0.5)"></div></div>
          <div class="r2"><div class="sub" style="width: 34px"></div><div class="sub" style="width: 52px"></div></div>
        </div>
        <div class="scard">
          <div class="r1"><div class="title" style="width: 60px"></div><div class="state"></div></div>
          <div class="r2"><div class="sub" style="width: 44px"></div><div class="sub" style="width: 30px"></div></div>
        </div>
        <div class="scard">
          <div class="r1"><div class="title" style="width: 84px"></div><div class="state"></div></div>
          <div class="r2"><div class="sub" style="width: 38px"></div><div class="sub" style="width: 46px"></div></div>
        </div>
      </div>
      <div class="col">
        <div class="tabs">
          <div class="tab active"><div class="tb"></div></div>
          <div class="tab"><div class="tb" style="width:44px"></div></div>
        </div>
        <div class="editor">
          <div class="cl" style="width: 34%"></div>
          <div class="cl dim" style="width: 58%; margin-left: 24px"></div>
          <div class="cl dim" style="width: 44%; margin-left: 24px"></div>
          <div class="cl" style="width: 66%; margin-left: 24px"></div>
          <div class="cl dim" style="width: 30%; margin-left: 48px"></div>
          <div class="cl dim" style="width: 52%; margin-left: 48px"></div>
          <div class="cl dim" style="width: 12%"></div>
          <div class="cl" style="width: 40%"></div>
          <div class="cl dim" style="width: 62%; margin-left: 24px"></div>
          <div class="cl dim" style="width: 36%; margin-left: 24px"></div>
          <div class="cl dim" style="width: 12%"></div>
        </div>
        <div class="panel">
          <div class="ptabs mono">
            <span class="ptab">TERMINAL</span>
            <span class="ptab agent">AGENT</span>
            <span class="ptab">OUTPUT</span>
          </div>
          <div class="prow mono"><span class="g caret">&#10095;</span><div class="b" style="width: 42%"></div></div>
          <div class="prow mono"><span class="g">&#9679;</span><div class="b" style="width: 64%"></div></div>
          <div class="prow mono"><span class="elbow"></span><div class="b dim" style="width: 36%"></div></div>
          <div class="prow mono"><span class="g">&#9670;</span><div class="b" style="width: 52%"></div></div>
        </div>
      </div>
    </div>
    <div class="status">
      <div class="live"></div>
      <div class="st" style="width: 52px"></div>
      <div class="st" style="width: 34px"></div>
      <div class="st" style="width: 40px; margin-left: auto"></div>
      <div class="st" style="width: 26px"></div>
    </div>
  </div>
</body>
</html>
