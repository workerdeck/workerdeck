version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "turbo"
          - "@swc-node/*"
          - "@types/*"
        update-types:
          - minor
          - patch
      docs-site:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "sharp"
          - "mermaid"
        update-types:
          - minor
          - patch
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      # Catch-all, last: without it every devDependency that misses the two
      # named groups above opens its own PR, which is the noise the limit is
      # there to prevent. The first run did exactly that for zod and postcss.
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
