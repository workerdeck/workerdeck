version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "turbo"
          - "@swc-node/*"
          - "@types/*"
        update-types:
          - minor
          - patch
      docs-site:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "sharp"
          - "mermaid"
        update-types:
          - minor
          - patch
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      # Catch-all, last: without it every devDependency that misses the two
      # named groups above opens its own PR, which is the noise the limit is
      # there to prevent. The first run did exactly that for zod and postcss.
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
    # QuickJS is pinned at 0.31 deliberately. 0.32 typechecks and then fails
    # 13/13 sandbox tests and 12 core tests on teardown with
    # `QuickJSRuntime(rt = N) not found when trying to free HostRef(id =
    # -2147483648)` - INT32_MIN, an uninitialized host ref freed on dispose,
    # upstream in quickjs-emscripten-core. The two packages must also move in
    # lockstep: the variant's module type only satisfies `SandboxVariantInput`
    # when it matches the core it was built against. Re-test both together
    # before lifting this, and run `pnpm smoke:sandbox`, not just the unit
    # tests - the types were green while the runtime was not.
    ignore:
      - dependency-name: "quickjs-emscripten-core"
      - dependency-name: "@jitl/quickjs-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
