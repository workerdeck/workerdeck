name: Publish

# Publishes all 10 packages (the @workerdeck/* libraries plus the unscoped
# `workerdeck` CLI) to npm via **trusted publishing**: pnpm
# trades this workflow's GitHub OIDC token for a short-lived publish credential,
# so there is no NPM_TOKEN in this repo and provenance attestations are generated
# automatically.
#
# NOTE for any FUTURE new package: a package must already EXIST on npm before a
# trusted publisher can be configured for it — the settings page lives on the
# package. So the first release of a new name is published by hand (`pnpm publish
# --access public` from its directory, which is also what rewrites `workspace:*`),
# and only then does it join this workflow.
#
# THE REBRAND RESET THIS. Every name below is new to npm as of the
# claude-worker → workerdeck rename, so the trusted-publisher configuration that
# existed on the old names does NOT carry over — it lives on the package, and
# these are different packages. Before 0.6.0 can go out through this workflow:
#
#   * `workerdeck` (unscoped) already exists — the 0.0.0 placeholder — so it can
#     be configured now, no manual publish needed.
#   * The 9 `@workerdeck/*` scoped packages do NOT exist yet. Each needs one
#     by-hand `pnpm publish --access public` first, then the trusted publisher
#     configured, before a tag push can release it.
#
# Until that is done a `v0.6.0` tag will fail on the scoped packages. The old
# `claude-worker` / `@claude-worker/*` packages stay published (deprecated, not
# unpublished) and are no longer released from here.
#
# One-time setup, per package, at npmjs.com → package → Settings → Trusted
# publisher (all fields are exact and case-sensitive):
#   Organization or user: tobiasstrebitzer
#   Repository:           workerdeck
#   Workflow filename:    publish.yml     <- filename only, NOT .github/workflows/publish.yml
#   Environment:          (leave blank)   <- if you set one here, add `environment:` to the job below
#
# Release flow: `pnpm version:set <x.y.z>`, commit, then `git tag v<x.y.z> &&
# git push --tags`. A tag runs the workflow from the TAGGED commit, so the tag
# must point at a commit that contains this file.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and report without uploading'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # mints the OIDC token npm exchanges for publish rights

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # registry-url writes an ~/.npmrc with an unresolved ${NODE_AUTH_TOKEN}
          # placeholder; pnpm >= 11.1.0 drops it so OIDC can take over (it 404s on
          # 11.0.8). packageManager pins 11.8.0 and action-setup honours it — do
          # not pin pnpm below 11.1.0 or trusted publishing breaks.
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in a release build

      - run: pnpm install --frozen-lockfile
      # Same gate as CI: a tag push doesn't inherit CI's verdict, and a publish
      # can't be taken back.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The tag is the release's name; if it disagrees with what's in the tree,
      # every downstream artifact (npm version, provenance, GitHub release) is
      # labelled wrong. Cheaper to catch here than to unpublish.
      - name: Check tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e '
            const { readdirSync, readFileSync } = require("node:fs")
            const want = process.argv[1].replace(/^v/, "")
            const bad = readdirSync("packages", { withFileTypes: true })
              .filter((e) => e.isDirectory())
              .map((e) => JSON.parse(readFileSync(`packages/${e.name}/package.json`, "utf8")))
              .filter((p) => p.private !== true && p.version !== want)
            if (bad.length > 0) {
              console.error(`tag says ${want}, but:\n` + bad.map((p) => `  - ${p.name} is ${p.version}`).join("\n"))
              process.exit(1)
            }
            console.log(`all ${want} — tag and packages agree`)
          ' "${{ github.ref_name }}"

      # pnpm publish -r walks every public package in dependency order, rewrites
      # `workspace:*` to the concrete version as it packs, runs each package's own
      # prepack, and skips versions already on the registry — so a half-failed run
      # is safe to re-run. --no-git-checks is required on a detached tag checkout.
      # A prerelease tag (v0.5.0-rc.1) publishes under `next` so it never becomes
      # npm's `latest`.
      - name: Publish
        run: >-
          pnpm publish -r --access public --no-git-checks
          ${{ contains(github.ref_name, '-') && '--tag next' || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
