name: Publish

# Two jobs. `publish` sends all 10 packages to npm; `vscode` then sends the
# extension to the VS Code Marketplace (see the comment on that job — it is the
# one credential in this repo that is not OIDC).
#
# Publishes all 10 packages (the @workerdeck/* libraries plus the unscoped
# `workerdeck` CLI) to npm via **trusted publishing**: pnpm
# trades this workflow's GitHub OIDC token for a short-lived publish credential,
# so there is no NPM_TOKEN in this repo and provenance attestations are generated
# automatically.
#
# NOTE for any FUTURE new package: a package must already EXIST on npm before a
# trusted publisher can be configured for it — the settings page lives on the
# package. So the first release of a new name is published by hand (`pnpm publish
# --access public` from its directory, which is also what rewrites `workspace:*`),
# and only then does it join this workflow.
#
# All 10 names were bootstrapped this way at 0.6.0, the first release under the
# workerdeck name; trusted publishing is configured on every one of them. The old
# `claude-worker` / `@claude-worker/*` packages stay published (deprecated, not
# unpublished) and are no longer released from here.
#
# One-time setup, per package, at npmjs.com → package → Settings → Trusted
# publisher (all fields are exact and case-sensitive):
#   Organization or user: workerdeck
#   Repository:           workerdeck
#   Workflow filename:    publish.yml     <- filename only, NOT .github/workflows/publish.yml
#   Environment:          (leave blank)   <- if you set one here, add `environment:` to the job below
#
# Release flow: `pnpm version:set <x.y.z>`, commit, then `git tag v<x.y.z> &&
# git push origin v<x.y.z>`. Push the ONE tag by name — never `git push --tags`,
# which on 2026-09-02 sent a stale local tag and moved every `latest` backwards
# (docs/RELEASING.md has the incident). A tag runs the workflow from the TAGGED
# commit, so the tag must point at a commit that contains this file.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and report without uploading'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # mints the OIDC token npm exchanges for publish rights

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # registry-url writes an ~/.npmrc with an unresolved ${NODE_AUTH_TOKEN}
          # placeholder; pnpm >= 11.1.0 drops it so OIDC can take over (it 404s on
          # 11.0.8). packageManager pins 11.8.0 and action-setup honours it — do
          # not pin pnpm below 11.1.0 or trusted publishing breaks.
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in a release build

      - run: pnpm install --frozen-lockfile
      # Same gate as CI: a tag push doesn't inherit CI's verdict, and a publish
      # can't be taken back.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The tag is the release's name; if it disagrees with what's in the tree,
      # every downstream artifact (npm version, provenance, GitHub release) is
      # labelled wrong. Cheaper to catch here than to unpublish.
      - name: Check tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e '
            const { readdirSync, readFileSync } = require("node:fs")
            const want = process.argv[1].replace(/^v/, "")
            const bad = readdirSync("packages", { withFileTypes: true })
              .filter((e) => e.isDirectory())
              .map((e) => JSON.parse(readFileSync(`packages/${e.name}/package.json`, "utf8")))
              .filter((p) => p.private !== true && p.version !== want)
            if (bad.length > 0) {
              console.error(`tag says ${want}, but:\n` + bad.map((p) => `  - ${p.name} is ${p.version}`).join("\n"))
              process.exit(1)
            }
            console.log(`all ${want} — tag and packages agree`)
          ' "${{ github.ref_name }}"

      # pnpm publish -r walks every public package in dependency order, rewrites
      # `workspace:*` to the concrete version as it packs, runs each package's own
      # prepack, and skips versions already on the registry — so a half-failed run
      # is safe to re-run. --no-git-checks is required on a detached tag checkout.
      # A prerelease tag (v0.5.0-rc.1) publishes under `next` so it never becomes
      # npm's `latest`.
      - name: Publish
        run: >-
          pnpm publish -r --access public --no-git-checks
          ${{ contains(github.ref_name, '-') && '--tag next' || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}

  # The VS Code Marketplace has no OIDC equivalent: `vsce` authenticates with a
  # long-lived Azure DevOps PAT (Marketplace -> Manage, scoped to ALL ACCESSIBLE
  # ORGANIZATIONS — a token scoped to one org fails to publish). That is a weaker
  # posture than the npm half's trusted publishing, so this job is deliberately
  # separate: it runs only after npm succeeded, it never runs for a prerelease
  # tag (the Marketplace has no dist-tags, so `next` has nowhere to go), and it
  # skips itself rather than failing the release when VSCE_PAT is absent.
  #
  # Rotate the PAT before it expires; a 401 here is almost always an expired or
  # single-org token. Manual fallback is `pnpm dlx @vscode/vsce publish
  # --no-dependencies` from apps/vscode, or a hand upload at
  # https://marketplace.visualstudio.com/manage/publishers/silkweave.
  vscode:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check the PAT is present
        id: pat
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VSCE_PAT is not set — skipping the Marketplace publish."
          fi

      # apps/vscode is bumped in lockstep by `pnpm version:set`, so the tag must
      # agree with it too. The npm job's check only walks packages/.
      - name: Check tag matches the extension version
        if: steps.pat.outputs.present == 'true'
        run: |
          node -e '
            const want = process.argv[1].replace(/^v/, "")
            const got = require("./apps/vscode/package.json").version
            if (got !== want) {
              console.error(`tag says ${want}, but workerdeck-vscode is ${got}`)
              process.exit(1)
            }
            console.log(`extension is ${want} — tag and manifest agree`)
          ' "${{ github.ref_name }}"

      - if: steps.pat.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # Package first, publish that exact file, keep it as the artifact — so the
      # thing downloadable from the run is byte-identical to the thing listed.
      # `pnpm package` runs `vscode:prepublish` (the esbuild + vite bundles) and
      # passes --no-dependencies, which skips vsce's `npm list --production`
      # walk: it cannot read pnpm's symlinked node_modules, and the vsix ships
      # no runtime node_modules anyway — everything is bundled.
      - name: Package the vsix
        if: steps.pat.outputs.present == 'true'
        working-directory: apps/vscode
        run: pnpm package

      - name: Publish to the Marketplace
        if: steps.pat.outputs.present == 'true'
        working-directory: apps/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --no-dependencies --packagePath workerdeck.vsix

      - name: Keep the vsix as a run artifact
        if: steps.pat.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: workerdeck-${{ github.ref_name }}.vsix
          path: apps/vscode/workerdeck.vsix
          if-no-files-found: error
