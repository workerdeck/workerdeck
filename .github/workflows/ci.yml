name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Side-loadable VS Code extension — not on the Marketplace yet, so the CI
      # artifact IS the distribution channel.
      - run: pnpm --filter workerdeck-vscode package
      - uses: actions/upload-artifact@v4
        with:
          name: workerdeck-vsix
          path: apps/vscode/workerdeck.vsix
