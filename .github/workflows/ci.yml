name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm fixtures:golden --check
      - run: pnpm fixtures:vm --check
      - run: pnpm test
      - run: pnpm build
      # Side-loadable VS Code extension - not on the Marketplace yet, so the CI
      # artifact IS the distribution channel.
      - run: pnpm --filter workerdeck-vscode package
      - uses: actions/upload-artifact@v7
        with:
          name: workerdeck-vsix
          path: apps/vscode/workerdeck.vsix

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t arm64-v8a build -p wd-native-jni --release
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
