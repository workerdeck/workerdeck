[package]
name = "wd-native-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "wdffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
wd-native = { path = "../core" }
serde = "1"
serde_json = "1"
uniffi = "0.32"

[lints]
workspace = true
