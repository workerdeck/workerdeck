[workspace]
resolver = "3"
members = ["crates/core", "crates/ffi", "crates/bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

# The host build the Android Gradle build runs: uniffi-bindgen reads its metadata symbols, which `strip` removes on
# Linux, and the JVM tests load it.
[profile.host]
inherits = "release"
strip = false
lto = false
codegen-units = 16
