name: WorkerDeckApp

options:
  bundleIdPrefix: bi.atomic.workerdeck
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

# The only dependency, and it is local: the app is a SwiftUI shell over the
# WorkerDeckKit package (protocol mirror + REST/WS client + transcript reducer),
# with one UIKit bridge in it — `RichTextEditor`, which the composer needs for
# attributed text and a caret position. Zero third-party packages by design.
packages:
  WorkerDeckKit:
    path: WorkerDeckKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      # Hot reload (InjectionNext). `-interposable` makes every function's
      # implementation replaceable at runtime, which is what lets an edited file
      # be swapped into a running app. Debug only — it is a linker-level
      # indirection and has no business in a shipped binary.
      #
      # It costs nothing when injection isn't running, so it stays on rather than
      # behind the WORKERDECK_HOT_RELOAD switch: needing a *rebuild* to start
      # hot-reloading would defeat the point.
      OTHER_LDFLAGS: [-Xlinker, -interposable]
      # How InjectionNext learns to recompile one file the way this project
      # compiles it. Without it, it guesses ("builtin" mode) and only manages
      # files in the main module — and stops managing even those as soon as the
      # build logs it was reading move.
      EMIT_FRONTEND_COMMAND_LINES: YES
      # The injection copy phase writes into the built .app and codesigns what it
      # copies, neither of which a sandboxed script may do. Scoped to Debug so
      # the release path keeps the stricter setting.
      ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  WorkerDeckApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      # PNGs are rendered from docs/assets/app-icon-apple-{master,layer}.svg —
      # see docs/assets/BRAND.md §"Regenerating the iOS app icon". The catalog
      # is checked in; the icon name is set below, never via Xcode's UI.
      - path: App/Assets.xcassets
    dependencies:
      - package: WorkerDeckKit
        product: WorkerDeckKit
    # Also generated (and gitignored). Xcode's "+ Capability" button would edit
    # the generated .xcodeproj instead and be lost on the next `xcodegen
    # generate`, so the capability is declared here or not at all.
    #
    # `development` is the correct value to keep checked in: it is what a build
    # run from Xcode needs, and Xcode rewrites it to `production` when exporting
    # for TestFlight or the App Store. The two are different APNs *token
    # namespaces*, not just different endpoints — see PushEnvironment.swift.
    entitlements:
      path: App/WorkerDeckApp.entitlements
      properties:
        aps-environment: development
    info:
      # Generated by XcodeGen (gitignored) — edit these properties, not the plist.
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WorkerDeck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Generated launch screen: an empty dict is the "just use the app
        # background" form, which is all a remote control needs.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # ATS off wholesale. A tailnet gateway is reached as plain
        # `http://your-mac.tailnet-name.ts.net:8787` — there is no TLS
        # certificate to trust and no stable public domain to write an
        # NSExceptionDomains entry for, and the tailnet itself is already an
        # encrypted, authenticated transport. This is a deliberate personal-use
        # tradeoff: the app only ever talks to a server the user runs and typed
        # the address of. Narrow this (or drop it entirely, behind an https
        # gateway) before distributing beyond personal use.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # The Add Media sheet's Camera tile. Photos and Files need no string:
        # `PhotosPicker` and `fileImporter` both run out of process and hand back
        # only what was chosen, so neither is a library-access grant.
        NSCameraUsageDescription:
          Take a photo to send to the session.
    # Hot reload, opt-in per build. InjectionNext's own script copies its
    # injection bundle (and the XCTest frameworks it needs) into the app and
    # codesigns them — worth ~10s and a fatter .app, so a normal build must not
    # pay for it. `scripts/deploy.sh --hot` sets the variable; nothing else does,
    # and without InjectionNext.app installed the phase is a no-op either way.
    postBuildScripts:
      - name: Copy injection bundle (hot reload)
        script: |
          [ "$WORKERDECK_HOT_RELOAD" = "YES" ] || exit 0
          RESOURCES="/Applications/InjectionNext.app/Contents/Resources"
          if [ ! -f "$RESOURCES/copy_bundle.sh" ]; then
            echo "warning: WORKERDECK_HOT_RELOAD is set but InjectionNext.app is not installed"
            exit 0
          fi
          export RESOURCES
          "$RESOURCES/copy_bundle.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Without this, `Color.accentColor` is the iOS system blue — close
        # enough to look intentional and wrong everywhere the brand appears.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: bi.atomic.workerdeck.ios
        PRODUCT_NAME: WorkerDeckApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
